<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal Cipher / Decipher</title>
<link rel="stylesheet" href="Styles.css">
</head>

<body>

<h1>Universal Cipher / Decipher</h1>

<div class="section">
    <h2>Cipher (Text → Image)</h2>

    <label>Font:</label>
    <select id="cipherFont"></select>

    <textarea id="cipherText" placeholder="Enter text here"></textarea>

    <button class="fullbtn" onclick="generateCipher()">Generate Image</button>

    <canvas id="cipherCanvas"></canvas>

    <button class="fullbtn" onclick="openCipherImage()">Open Image</button>
    <button class="fullbtn" onclick="downloadCipherImage()">Download Image</button>

</div>

<div class="section">
    <h2>Decipher (Image → Text)</h2>

    <label>Font:</label>
    <select id="decodeFont"></select>

    <button class="fullbtn" onclick="copyCipherToClipboard()">Copy to Clipboard</button>
    <button class="fullbtn" onclick="saveCipherToPhotos()">Save to Photos</button>

    <input type="file" id="decodeUpload" class="fullbtn">

    <button class="fullbtn" onclick="decodeImage()">Decode Image</button>

    <pre id="decodeOutput"></pre>
</div>

<script src="cipher.js"></script>
</body>
</html>
