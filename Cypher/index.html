<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal Cipher / Decipher</title>
<style>
    body {
        font-family: sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }
    textarea {
        width: 100%;
        height: 120px;
        font-size: 16px;
        padding: 10px;
    }
    select, button, input {
        font-size: 16px;
        padding: 8px;
        margin: 5px 0;
    }
    canvas {
        border: 1px solid #ccc;
        margin-top: 10px;
    }
</style>
</head>

<body>

<h2>Universal Cipher / Decipher</h2>

<h3>Cipher (Text → Image)</h3>
<label>Font:</label>
<select id="cipherFont"></select>
<br>
<textarea id="cipherInput" placeholder="Enter text to encode (supports multi-line)"></textarea>
<br>
<button onclick="encode()">Generate Image</button>
<br>
<canvas id="cipherCanvas"></canvas>
<br>
<button onclick="downloadCipher()">Download PNG</button>

<hr>

<h3>Decipher (Image → Text)</h3>
<label>Font:</label>
<select id="decipherFont"></select>
<br>
<input type="file" id="imageUpload">
<button onclick="decode()">Decode Image</button>
<p id="decipherOutput"></p>

<script src="cipher.js"></script>
</body>
</html>
