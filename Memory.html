<script>
/* -------------------------------------------------
   GLOBAL STATE
---------------------------------------------------*/
let currentTheme = "garden";
let currentDifficulty = 10;

let deckGarden = [];          // SVG icons (Chunk 2)
let deckMom = [];             // Garden-day hat (Chunk 2)
let deckDanganronpa = [];     // Your 10 fronts (Chunk 5)
let deckPersonalB = [];       // Uploaded images (Chunk 6)

let cardBackImage = null;     // Monokuma (Chunk 5)

let boardEl = null;

/* -------------------------------------------------
   INITIAL SETUP (runs after DOM loads)
---------------------------------------------------*/
document.addEventListener("DOMContentLoaded", () => {
    boardEl = document.getElementById("board");

    // Theme selector
    document.getElementById("themeSelector").addEventListener("change", (e) => {
        currentTheme = e.target.value;
    });

    // Difficulty selector
    document.getElementById("difficultySelector").addEventListener("change", (e) => {
        currentDifficulty = parseInt(e.target.value, 10);
    });

    // New Game button
    document.getElementById("newGameBtn").addEventListener("click", () => {
        startNewGame();
    });

    // Upload reset button (Personal Deck B)
    document.getElementById("resetUploadsBtn").addEventListener("click", () => {
        resetUploads();
    });
});


/* -------------------------------------------------
   NEW GAME: Clears board + builds new deck
---------------------------------------------------*/
function startNewGame() {
    clearBoard();

    console.log("Theme:", currentTheme);

    const deck = buildDeckForTheme(currentTheme);
    console.log("Deck returned by buildDeckForTheme:", deck);

    const trimmedDeck = deck.slice(0, currentDifficulty);
    console.log("Trimmed deck:", trimmedDeck);

    const fullDeck = duplicateAndShuffle(trimmedDeck);
    console.log("Full deck:", fullDeck);

    renderBoard(fullDeck);

    document.getElementById("statusBar").textContent =
        `Theme: ${currentTheme}, Pairs: ${currentDifficulty}`;
}

/* -------------------------------------------------
   CLEAR BOARD
---------------------------------------------------*/
function clearBoard() {
    boardEl.innerHTML = "";
}

/* -------------------------------------------------
   BUILD DECK FOR THE CURRENT THEME
---------------------------------------------------*/
function buildDeckForTheme(theme) {
    if (theme === "garden") return deckGarden;
    if (theme === "mom") return deckMom;
    if (theme === "danganronpa") return deckDanganronpa;
    return deckPersonalB;
}

/* -------------------------------------------------
   DUPLICATE + SHUFFLE (Fisher–Yates)
---------------------------------------------------*/
function duplicateAndShuffle(arr) {
    const doubled = [...arr, ...arr];
    for (let i = doubled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [doubled[i], doubled[j]] = [doubled[j], doubled[i]];
    }
    return doubled;
}

/* -------------------------------------------------
   RENDER BOARD (cards appear here)
---------------------------------------------------*/
function renderBoard(deck) {
    // Grid auto-fit based on difficulty
    const columns = Math.ceil(Math.sqrt(deck.length));
    boardEl.style.gridTemplateColumns = `repeat(${columns}, 110px)`;

    deck.forEach((item, index) => {
        const card = createCard(item, index);
        boardEl.appendChild(card);
    });
}

/* -------------------------------------------------
   CREATE CARD (front + back)
---------------------------------------------------*/
function createCard(item, index) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.index = index;

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const front = document.createElement("div");
    front.className = "card-face card-front";

    const back = document.createElement("div");
    back.className = "card-face card-back";

    // FRONT IMAGE
    const imgFront = document.createElement("img");
    imgFront.src = item;
    front.appendChild(imgFront);

    // BACK IMAGE (Monokuma or garden icon)
    const imgBack = document.createElement("img");
    imgBack.src = cardBackImage || ""; // Filled in Chunk 5
    back.appendChild(imgBack);

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    // Flip handler (actual logic in Chunk 7)
    card.addEventListener("click", () => {
        handleCardFlip(card);
    });

    return card;
}

/* -------------------------------------------------
   PLACEHOLDER: Flip Logic (real logic in Chunk 7)
---------------------------------------------------*/
function handleCardFlip(card) {
    // Placeholder — real matching logic arrives in Chunk 7
    card.classList.toggle("flipped");
}

}

    if (uploadedImages.length >= 10) {
        danganronpaFronts.swimmer        = uploadedImages[0];
        danganronpaFronts.glassesSuit    = uploadedImages[1];
        danganronpaFronts.rastaHair      = uploadedImages[2];
        danganronpaFronts.nerdyGirl      = uploadedImages[3];
        danganronpaFronts.protagonist    = uploadedImages[4];
        danganronpaFronts.evilGirl       = uploadedImages[5];
        danganronpaFronts.detectiveGirl  = uploadedImages[6];
        danganronpaFronts.chihiro        = uploadedImages[7];
        danganronpaFronts.blueHairGirl   = uploadedImages[8];
        danganronpaFronts.bikerGuy       = uploadedImages[9];

}

/* 4 — Call this after uploads */
document.getElementById("uploadInput").addEventListener("change", () => {

/* 5 — Preview panel for debugging */
function updatePreviewPanel() {

<script>
/* -------------------------------------------------
   PERSONAL DECK B: Uploaded Images
---------------------------------------------------*/
let uploadedImages = [];   // Stores up to 10 images
const MAX_UPLOADS = 10;

/* -------------------------------------------------
   UPLOAD INPUT HANDLER
---------------------------------------------------*/
document.addEventListener("DOMContentLoaded", () => {
    const uploadInput = document.getElementById("uploadInput");

    uploadInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files);

        for (const file of files) {
            if (uploadedImages.length >= MAX_UPLOADS) break;

            const src = await fileToDataURL(file);
            uploadedImages.push(src);
        }

        updateUploadCount();
        loadPersonalDeckB();
    });
});

/* -------------------------------------------------
   FILE → DATA URL CONVERSION
---------------------------------------------------*/
function fileToDataURL(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
    });
}

/* -------------------------------------------------
   LOAD PERSONAL DECK B INTO GAME
---------------------------------------------------*/
function loadPersonalDeckB() {
    deckPersonalB = [...uploadedImages];
}

/* -------------------------------------------------
   UPDATE COUNTER DISPLAY
---------------------------------------------------*/
function updateUploadCount() {
    const countEl = document.getElementById("uploadCount");
    countEl.textContent = `Uploaded: ${uploadedImages.length} / ${MAX_UPLOADS}`;
}

/* -------------------------------------------------
   RESET UPLOADS
---------------------------------------------------*/
function resetUploads() {
    uploadedImages = [];
    deckPersonalB = [];
    document.getElementById("uploadInput").value = "";
    updateUploadCount();
}

</script>

<script>
/* -------------------------------------------------
   MATCHING STATE
---------------------------------------------------*/
let firstCard = null;
let secondCard = null;
let lockBoard = false;
let matchesFound = 0;

/* -------------------------------------------------
   HANDLE CARD FLIP
---------------------------------------------------*/
function handleCardFlip(card) {
    if (lockBoard) return;
    if (card === firstCard) return;

    card.classList.add("flipped");

    if (!firstCard) {
        firstCard = card;
        return;
    }

    secondCard = card;
    lockBoard = true;

    checkForMatch();
}

/* -------------------------------------------------
   CHECK IF TWO FLIPPED CARDS MATCH
---------------------------------------------------*/
function checkForMatch() {
    const img1 = firstCard.querySelector(".card-front img").src;
    const img2 = secondCard.querySelector(".card-front img").src;

    if (img1 === img2) {
        lockMatchedCards();
    } else {
        unflipCards();
    }
}

/* -------------------------------------------------
   MATCH FOUND → LOCK CARDS
---------------------------------------------------*/
function lockMatchedCards() {
    firstCard.removeEventListener("click", handleCardFlip);
    secondCard.removeEventListener("click", handleCardFlip);

    matchesFound++;

    resetFlipState();

    checkForWin();
}

/* -------------------------------------------------
   NO MATCH → UNFLIP CARDS
---------------------------------------------------*/
function unflipCards() {
    setTimeout(() => {
        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");
        resetFlipState();
    }, 900);
}

/* -------------------------------------------------
   RESET FLIP STATE
---------------------------------------------------*/
function resetFlipState() {
    [firstCard, secondCard] = [null, null];
    lockBoard = false;
}

/* -------------------------------------------------
   CHECK FOR WIN
---------------------------------------------------*/
function checkForWin() {
    const totalPairs = currentDifficulty;

    if (matchesFound >= totalPairs) {
        document.getElementById("statusBar").textContent =
            "🎉 All pairs matched! Great job!";
    }
}

/* -------------------------------------------------
   RESET MATCH COUNTER ON NEW GAME
---------------------------------------------------*/
function startNewGame() {
    matchesFound = 0;
    clearBoard();

    const deck = buildDeckForTheme(currentTheme);
    const trimmedDeck = deck.slice(0, currentDifficulty);

    const fullDeck = duplicateAndShuffle(trimmedDeck);

    renderBoard(fullDeck);

    document.getElementById("statusBar").textContent =
        `Theme: ${currentTheme}, Pairs: ${currentDifficulty}`;
}

</script>

<script>
/* -------------------------------------------------
   APPLY SHAKE EFFECT ON MISMATCH
---------------------------------------------------*/
function unflipCards() {
    firstCard.classList.add("shake");
    secondCard.classList.add("shake");

    setTimeout(() => {
        firstCard.classList.remove("shake");
        secondCard.classList.remove("shake");

        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");

        resetFlipState();
    }, 900);
}

/* -------------------------------------------------
   STATUS BAR HELPER
---------------------------------------------------*/
function updateStatusBar() {
    const status = document.getElementById("statusBar");
    status.textContent = `Theme: ${currentTheme}, Pairs: ${currentDifficulty}`;
}

/* -------------------------------------------------
   NEW GAME OVERRIDE (adds polish)
---------------------------------------------------*/
const originalStartNewGame = startNewGame;

startNewGame = function () {
    matchesFound = 0;
    clearBoard();

    const deck = buildDeckForTheme(currentTheme);
    const trimmedDeck = deck.slice(0, currentDifficulty);
    const fullDeck = duplicateAndShuffle(trimmedDeck);

    renderBoard(fullDeck);
    updateStatusBar();
};
