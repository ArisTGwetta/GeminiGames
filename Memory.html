<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Garden & Danganronpa Memory</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #e8f5e9;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    #controls {
        text-align: center;
        margin-bottom: 20px;
    }

    select, button {
        padding: 8px 12px;
        margin: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(5, 120px);
        grid-gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
    }

    .card {
        width: 120px;
        height: 120px;
        perspective: 800px;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
        transform: rotateY(180deg);
    }

    .card-front, .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        overflow: hidden;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-back img, .card-back img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .card-front {
        transform: rotateY(180deg);
    }

    #uploadSection {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        background: #f1f8e9;
        border-radius: 12px;
    }

    #previewPanel {
        margin-top: 20px;
        padding: 10px;
        background: #eef5ea;
        border-radius: 12px;
        font-size: 0.85rem;
    }

    #previewPanel img {
        width: 60px;
        margin: 4px;
        border-radius: 8px;
    }
</style>
</head>

<body>

<h1>Memory Game</h1>

<div id="controls">
    <select id="themeSelect">
        <option value="garden">Garden (Default)</option>
        <option value="danganronpa">Danganronpa Deck</option>
    </select>

    <select id="difficultySelect">
        <option value="4">Easy (4 pairs)</option>
        <option value="6">Medium (6 pairs)</option>
        <option value="8">Hard (8 pairs)</option>
        <option value="10" selected>Full Deck (10 pairs)</option>
    </select>

    <button onclick="startNewGame()">New Game</button>
</div>

<div id="statusBar" style="text-align:center; margin-bottom:10px;">
    Theme: garden, Pairs: 10
</div>

<div id="board"></div>

<div id="uploadSection">
    <h3>Personal Deck B</h3>
    <input type="file" id="uploadInput" multiple accept="image/*">
    <button onclick="resetUploads()">Reset Uploads</button>
    <div id="uploadCount">Uploaded: 0 / 10</div>
</div>

<div id="previewPanel">
    <strong>Image Preview Panel</strong><br>
    (Shows all deck images + card back)
</div>

<script>
/* ============================================================
   DECK ARRAYS
============================================================ */
let deckGarden = [];
let deckMom = [];
let deckDanganronpa = [];
let deckPersonalB = [];
let uploadedImages = [];

let currentTheme = "garden";
let currentDifficulty = 10;
let cardBackImage = "";

// Memory game state
let flippedCards = [];
let lockBoard = false;


/* ============================================================
   BUILD DECKS FROM LOCAL PNG ASSETS
============================================================ */
function buildGardenDeck() {
    deckGarden = [
        "memoryassets/Default01.png",
        "memoryassets/Default02.png",
        "memoryassets/Default03.png",
        "memoryassets/Default04.png",
        "memoryassets/Default05.png",
        "memoryassets/Default06.png",
        "memoryassets/Default07.png",
        "memoryassets/Default08.png",
        "memoryassets/Default09.png",
        "memoryassets/Default10.png"
    ];
}

function buildMomDeck() {
    deckMom = [...deckGarden];
}

function applyGardenBack() {
    cardBackImage = "memoryassets/Defaultcardback.jpg";
}

function buildDanganronpaDeck() {
    deckDanganronpa = [
        "memoryassets/DG01.png",
        "memoryassets/DG02.png",
        "memoryassets/DG03.png",
        "memoryassets/DG04.png",
        "memoryassets/DG05.png",
        "memoryassets/DG06.png",
        "memoryassets/DG07.png",
        "memoryassets/DG08.png",
        "memoryassets/DG09.png",
        "memoryassets/DG10.png"
    ];
}

function applyDanganronpaBack() {
    cardBackImage = "memoryassets/DGcardback.jpg";
}

/* ============================================================
   PERSONAL DECK UPLOADS
============================================================ */
function resetUploads() {
    uploadedImages = [];
    deckPersonalB = [];
    document.getElementById("uploadCount").textContent = "Uploaded: 0 / 10";
    updatePreviewPanel();
}

document.getElementById("uploadInput").addEventListener("change", async (event) => {
    const files = event.target.files;
    uploadedImages = [];

    for (let i = 0; i < files.length && i < 10; i++) {
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImages.push(e.target.result);
            deckPersonalB = [...uploadedImages];
            updatePreviewPanel();
        };
        reader.readAsDataURL(files[i]);
    }

    document.getElementById("uploadCount").textContent =
        `Uploaded: ${uploadedImages.length} / 10`;
});

/* ============================================================
   DECK SELECTION
============================================================ */
function buildDeckForTheme(theme) {
    if (theme === "garden") {
        applyGardenBack();
        return deckGarden;
    }
    if (theme === "danganronpa") {
        applyDanganronpaBack();
        return deckDanganronpa;
    }
    return deckGarden;
}

/* ============================================================
   BOARD RENDERING
============================================================ */
function clearBoard() {
    document.getElementById("board").innerHTML = "";
}

function duplicateAndShuffle(deck) {
    const doubled = [...deck, ...deck];
    for (let i = doubled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [doubled[i], doubled[j]] = [doubled[j], doubled[i]];
    }
    return doubled;
}

function renderBoard(fullDeck) {
    const board = document.getElementById("board");
    board.innerHTML = "";

    fullDeck.forEach(src => {
        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-front"><img src="${src}"></div>
                <div class="card-back"><img src="${cardBackImage}"></div>
            </div>
        `;

        card.addEventListener("click", () => handleCardFlip(card, src));

        board.appendChild(card);
    });
}


/* ============================================================
   NEW GAME
============================================================ */
function startNewGame() {
    clearBoard();

    currentTheme = document.getElementById("themeSelect").value;
    currentDifficulty = parseInt(document.getElementById("difficultySelect").value);

    const deck = buildDeckForTheme(currentTheme);
    const trimmedDeck = deck.slice(0, currentDifficulty);
    const fullDeck = duplicateAndShuffle(trimmedDeck);

    renderBoard(fullDeck);

    document.getElementById("statusBar").textContent =
        `Theme: ${currentTheme}, Pairs: ${currentDifficulty}`;

    updatePreviewPanel();
}

/* ============================================================
   PREVIEW PANEL
============================================================ */
function updatePreviewPanel() {
    const preview = document.getElementById("previewPanel");
    preview.innerHTML = "<strong>Image Preview Panel</strong><br>";

    const decks = [
        { name: "Garden Deck", items: deckGarden },
        { name: "Mom Deck", items: deckMom },
        { name: "Danganronpa Deck", items: deckDanganronpa },
        { name: "Personal Deck B", items: deckPersonalB },
        { name: "Card Back", items: [cardBackImage] }
    ];

    decks.forEach(deck => {
        const section = document.createElement("div");
        section.innerHTML = `<strong>${deck.name}</strong><br>`;
        deck.items.forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            section.appendChild(img);
        });
        preview.appendChild(section);
    });
}

function handleCardFlip(card, src) {
    if (lockBoard) return;
    if (card.classList.contains("matched")) return;

    card.classList.add("flipped");
    flippedCards.push({ card, src });

    if (flippedCards.length === 2) {
        lockBoard = true;

        const [first, second] = flippedCards;

        if (first.src === second.src) {
            // MATCH
            first.card.classList.add("matched");
            second.card.classList.add("matched");
            flippedCards = [];
            lockBoard = false;
        } else {
            // NO MATCH → flip back after delay
            setTimeout(() => {
                first.card.classList.remove("flipped");
                second.card.classList.remove("flipped");
                flippedCards = [];
                lockBoard = false;
            }, 900);
        }
    }
}


/* ============================================================
   INITIAL LOAD
============================================================ */
document.addEventListener("DOMContentLoaded", () => {
    buildGardenDeck();
    buildMomDeck();
    buildDanganronpaDeck();
    applyGardenBack();
    startNewGame();
});
</script>

</body>
</html>
