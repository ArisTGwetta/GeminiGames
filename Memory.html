<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Game</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #e8f5e9;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    #controls {
        text-align: center;
        margin-bottom: 20px;
    }

    select, button {
        padding: 8px 12px;
        margin: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    #board {
        display: grid;
        grid-gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
    }

    .card {
        width: 120px;
        height: 120px;
        perspective: 800px;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
        transform: rotateY(180deg);
    }

    .card-front, .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        overflow: hidden;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-front {
        transform: rotateY(180deg);
    }

    .card-back {
        transform: rotateY(0deg);
    }

    .card-front img, .card-back img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    #uploadSection {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        background: #f1f8e9;
        border-radius: 12px;
    }

    #previewPanel {
        margin-top: 20px;
        padding: 10px;
        background: #eef5ea;
        border-radius: 12px;
        font-size: 0.85rem;
    }

    #previewPanel img {
        width: 60px;
        margin: 4px;
        border-radius: 8px;
    }
</style>
</head>

<body>

<h1>Memory Game</h1>

<div id="controls">
    <select id="themeSelect">
        <option value="garden">Garden (Default)</option>
        <option value="mom">Mahotsukai no Yakusoku Deck</option>
        <option value="danganronpa">Danganronpa Deck</option>
    </select>

    <select id="difficultySelect">
        <option value="4">Easy (4 pairs)</option>
        <option value="6">Medium (6 pairs)</option>
        <option value="8">Hard (8 pairs)</option>
        <option value="10" selected>Full Deck (10 pairs)</option>
    </select>

    <button onclick="startNewGame()">New Game</button>
</div>

<div id="statusBar" style="text-align:center; margin-bottom:10px;">
    Theme: garden, Pairs: 10
</div>

<div id="board"></div>

<div id="uploadSection">
    <h3>Personal Deck B</h3>
    <input type="file" id="uploadInput" multiple accept="image/*">
    <button onclick="resetUploads()">Reset Uploads</button>
    <div id="uploadCount">Uploaded: 0 / 10</div>
</div>

<div id="previewPanel">
    <strong>Image Preview Panel</strong><br>
    (Shows all deck images + card back)
</div>

<script>
/* ============================================================
   RAW GITHUB URL BASE
============================================================ */
const RAW = "https://raw.githubusercontent.com/ArisTGwetta/GeminiGames/main/MemoryAssets/";

/* ============================================================
   DECK ARRAYS
============================================================ */
let deckGarden = [];
let deckMom = [];
let deckDanganronpa = [];
let deckPersonalB = [];
let uploadedImages = [];

let currentTheme = "garden";
let currentDifficulty = 10;
let cardBackImage = "";
let rewardImage = "";

let flippedCards = [];
let lockBoard = false;
let matchesFound = 0;

/* ============================================================
   BUILD DECKS
============================================================ */
function buildGardenDeck() {
    deckGarden = [
        RAW+"Default01.png",
        RAW+"Default02.png",
        RAW+"Default03.png",
        RAW+"Default04.png",
        RAW+"Default05.png",
        RAW+"Default06.png",
        RAW+"Default07.png",
        RAW+"Default08.png",
        RAW+"Default09.png",
        RAW+"Default10.png"
    ];
}

function applyGardenBack() {
    cardBackImage = RAW+"Defaultcardback.jpg";
    rewardImage = RAW+"Defaultreward.jpg";
}

function buildMomDeck() {
    deckMom = [
        RAW+"PW01.png",
        RAW+"PW02.png",
        RAW+"PW03.png",
        RAW+"PW04.png",
        RAW+"PW05.png",
        RAW+"PW06.png",
        RAW+"PW07.png",
        RAW+"PW08.png",
        RAW+"PW09.png",
        RAW+"PW10.png"
    ];
}


function applyMomBack() {
    cardBackImage = RAW+"PWcardback.jpg";
    rewardImage = RAW+"PWreward.jpg";
}

function buildDanganronpaDeck() {
    deckDanganronpa = [
        RAW+"DG01.png",
        RAW+"DG02.png",
        RAW+"DG03.png",
        RAW+"DG04.png",
        RAW+"DG05.png",
        RAW+"DG06.png",
        RAW+"DG07.png",
        RAW+"DG08.png",
        RAW+"DG09.png",
        RAW+"DG10.png"
    ];
}

function applyDanganronpaBack() {
    cardBackImage = RAW+"DGcardback.jpg";
    rewardImage = RAW+"DGreward.jpg";
}

/* ============================================================
   PERSONAL DECK UPLOADS
============================================================ */
function resetUploads() {
    uploadedImages = [];
    deckPersonalB = [];
    document.getElementById("uploadCount").textContent = "Uploaded: 0 / 10";
    updatePreviewPanel();
}

document.getElementById("uploadInput").addEventListener("change", async (event) => {
    const files = event.target.files;
    uploadedImages = [];

    for (let i = 0; i < files.length && i < 10; i++) {
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImages.push(e.target.result);
            deckPersonalB = [...uploadedImages];
            updatePreviewPanel();
        };
        reader.readAsDataURL(files[i]);
    }

    document.getElementById("uploadCount").textContent =
        `Uploaded: ${uploadedImages.length} / 10`;
});

/* ============================================================
   DECK SELECTION
============================================================ */
function buildDeckForTheme(theme) {
    if (theme === "garden") {
        applyGardenBack();
        return deckGarden;
    }
    if (theme === "Mahotsukai no Yakusoku") {
        applyMomBack();
        return deckMom;
    }
    if (theme === "danganronpa") {
        applyDanganronpaBack();
        return deckDanganronpa;
    }
    return deckGarden;
}

/* ============================================================
   BOARD LAYOUT (cute rectangles)
============================================================ */
function updateGridLayout(cardCount) {
    const board = document.getElementById("board");

    if (cardCount === 8) board.style.gridTemplateColumns = "repeat(4, 120px)";
    else if (cardCount === 12) board.style.gridTemplateColumns = "repeat(4, 120px)";
    else if (cardCount === 16) board.style.gridTemplateColumns = "repeat(4, 120px)";
    else if (cardCount === 20) board.style.gridTemplateColumns = "repeat(5, 120px)";
    else board.style.gridTemplateColumns = "repeat(5, 120px)";
}

/* ============================================================
   BOARD RENDERING
============================================================ */
function clearBoard() {
    document.getElementById("board").innerHTML = "";
}

function duplicateAndShuffle(deck) {
    const doubled = [...deck, ...deck];
    for (let i = doubled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [doubled[i], doubled[j]] = [doubled[j], doubled[i]];
    }
    return doubled;
}

function renderBoard(fullDeck) {
    const board = document.getElementById("board");
    board.innerHTML = "";

    fullDeck.forEach(src => {
        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-front"><img src="${src}"></div>
                <div class="card-back"><img src="${cardBackImage}"></div>
            </div>
        `;

        card.addEventListener("click", () => handleCardFlip(card, src));

        board.appendChild(card);
    });
}

/* ============================================================
   MATCHING LOGIC
============================================================ */
function handleCardFlip(card, src) {
    if (lockBoard) return;
    if (card.classList.contains("matched")) return;

    card.classList.add("flipped");
    flippedCards.push({ card, src });

    if (flippedCards.length === 2) {
        lockBoard = true;

        const [first, second] = flippedCards;

        if (first.src === second.src) {
            first.card.classList.add("matched");
            second.card.classList.add("matched");

            matchesFound++;
            flippedCards = [];
            lockBoard = false;

            checkForWin();
        } else {
            setTimeout(() => {
                first.card.classList.remove("flipped");
                second.card.classList.remove("flipped");
                flippedCards = [];
                lockBoard = false;
            }, 900);
        }
    }
}

/* ============================================================
   WIN DETECTION + FULLSCREEN CELEBRATION
============================================================ */
function checkForWin() {
    if (matchesFound >= currentDifficulty) {
        celebrateWin();
    }
}

function celebrateWin() {
    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100vw";
    overlay.style.height = "100vh";
    overlay.style.background = "rgba(0,0,0,0.6)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "9999";

    const box = document.createElement("div");
    box.style.background = "white";
    box.style.padding = "20px";
    box.style.borderRadius = "12px";
    box.style.textAlign = "center";
    box.style.boxShadow = "0 0 20px rgba(0,0,0,0.4)";
    box.style.maxWidth = "90vw";

    box.innerHTML = `
        <h2>You Win!</h2>
        <img src="${rewardImage}" style="width:60vw; max-width:400px; border-radius:12px;">
        <br><br>
        <button style="
            padding:12px 24px;
            border-radius:8px;
            border:none;
            background:#66bb6a;
            color:white;
            font-size:1.2rem;
            cursor:pointer;
        ">OK</button>
    `;

    box.querySelector("button").addEventListener("click", () => {
        overlay.remove();
        startNewGame();
    });

    overlay.appendChild(box);
    document.body.appendChild(overlay);
}

/* ============================================================
   NEW GAME
============================================================ */
function startNewGame() {
    clearBoard();

    currentTheme = document.getElementById("themeSelect").value;
    currentDifficulty = parseInt(document.getElementById("difficultySelect").value);

    matchesFound = 0;
    flippedCards = [];
    lockBoard = false;

    const deck = buildDeckForTheme(currentTheme);
    const trimmedDeck = deck.slice(0, currentDifficulty);
    const fullDeck = duplicateAndShuffle(trimmedDeck);

    updateGridLayout(fullDeck.length);
    renderBoard(fullDeck);

    document.getElementById("statusBar").textContent =
        `Theme: ${currentTheme}, Pairs: ${currentDifficulty}`;

    updatePreviewPanel();
}

/* ============================================================
   PREVIEW PANEL
============================================================ */
function updatePreviewPanel() {
    const preview = document.getElementById("previewPanel");
    preview.innerHTML = "<strong>Image Preview Panel</strong><br>";

    const decks = [
        { name: "Garden Deck", items: deckGarden },
        { name: "Mahotsukai no Yakusoku Deck", items: deckMom },
        { name: "Danganronpa Deck", items: deckDanganronpa },
        { name: "Personal Deck B", items: deckPersonalB },
        { name: "Card Back", items: [cardBackImage] },
        { name: "Reward Image", items: [rewardImage] }
    ];

    decks.forEach(deck => {
        const section = document.createElement("div");
        section.innerHTML = `<strong>${deck.name}</strong><br>`;
        deck.items.forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            section.appendChild(img);
        });
        preview.appendChild(section);
    });
}

/* ============================================================
   INITIAL LOAD
============================================================ */
document.addEventListener("DOMContentLoaded", () => {
    buildGardenDeck();
    buildMomDeck();
    buildDanganronpaDeck();
    applyGardenBack();
    startNewGame();
});
</script>

</body>
</html>
