<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puzzle Game v4</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1 { margin:10px; }

#puzzle {
  position:relative;
  margin:10px auto;
  touch-action:none;
  border-radius:12px;
  overflow:hidden;
  background:#020617;
}

.tile {
  position:absolute;
  border-radius:8px;
  transition: all 0.25s ease;
  background-repeat:no-repeat;
}

#controls {
  margin:10px auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

#overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#zoomImage {
  max-width:90vw;
  max-height:80vh;
  object-fit:contain;
  transform: scale(0.8);
  opacity:0;
  transition: all 0.5s ease;
}

button {
  padding:8px;
  margin:5px;
  font-size:16px;
}
</style>

</head>
<body>

<h1>🧩 Puzzle Game</h1>

<p>Moves: <span id="moves">0</span></p>

<div id="puzzle"></div>

<div id="controls">
  Size:
  <input type="number" id="size" value="4" min="2" max="8">

  <input type="file" id="imgUpload">

  <button onclick="startGame()">Start</button>
</div>

<div id="overlay">
  <h2>✨ Completed ✨</h2>
  <img id="zoomImage">
  <br>
  <button onclick="startGame()">Play Again</button>
</div>

<script>
let size, tiles, empty, moves;
let imageSrc = '';
let loadedImg = null;

const fallbackImage = "https://picsum.photos/800";

const puzzle = document.getElementById('puzzle');

document.getElementById('imgUpload').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const blobURL = URL.createObjectURL(file);

  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = blobURL;

  img.onload = () => {
    console.log("Image loaded successfully.");
    imageSrc = blobURL;
    loadedImg = img;
  };

  img.onerror = () => {
    console.error("Image failed to load.");
    alert("Image could not be loaded.");
  };
};

async function ensureImageLoaded() {
  if (imageSrc && loadedImg) return;

  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = fallbackImage;

  img.onload = () => {
    imageSrc = fallbackImage;
    loadedImg = img;
  };
}

async function startGame(){
  await ensureImageLoaded();

  size = +document.getElementById('size').value;

  const maxW = window.innerWidth * 0.9;
  const maxH = window.innerHeight * 0.5;

  const imgRatio = loadedImg.width / loadedImg.height;

  let puzzleW = maxW;
  let puzzleH = puzzleW / imgRatio;

  if (puzzleH > maxH) {
    puzzleH = maxH;
    puzzleW = puzzleH * imgRatio;
  }

  puzzle.style.width = puzzleW + "px";
  puzzle.style.height = puzzleH + "px";

  tiles = [...Array(size*size).keys()];
  empty = tiles.length-1;

  for(let i=0;i<150;i++) randomMove();

  moves=0;
  document.getElementById('moves').textContent=0;
  document.getElementById('overlay').style.display="none";

  draw();
}

function draw(){
  puzzle.innerHTML='';
  let tileW = puzzle.clientWidth / size;
  let tileH = puzzle.clientHeight / size;

  tiles.forEach((val,i)=>{
    if(val===size*size-1) return;

    let d=document.createElement('div');
    d.className='tile';

    let r=Math.floor(i/size), c=i%size;
    d.style.width=tileW+"px";
    d.style.height=tileH+"px";
    d.style.left=c*tileW+"px";
    d.style.top=r*tileH+"px";

    let ir=Math.floor(val/size), ic=val%size;

    d.style.backgroundImage=`url(${imageSrc})`;
    d.style.backgroundSize=`${puzzle.clientWidth}px ${puzzle.clientHeight}px`;
    d.style.backgroundPosition=`-${ic*tileW}px -${ir*tileH}px`;

    d.onclick=()=>move(i);

    puzzle.appendChild(d);
  });
}

function move(i){
  if(canMove(i)){
    [tiles[i],tiles[empty]]=[tiles[empty],tiles[i]];
    empty=i;
    moves++;
    document.getElementById('moves').textContent=moves;
    draw();

    if(isSolved()) win();
  }
}

function canMove(i){
  let r=Math.floor(i/size), c=i%size;
  let er=Math.floor(empty/size), ec=empty%size;
  return (r===er&&Math.abs(c-ec)===1)||(c===ec&&Math.abs(r-er)===1);
}

function randomMove(){
  let opts=[];
  let r=Math.floor(empty/size), c=empty%size;

  if(r>0) opts.push(empty-size);
  if(r<size-1) opts.push(empty+size);
  if(c>0) opts.push(empty-1);
  if(c<size-1) opts.push(empty+1);

  let t=opts[Math.floor(Math.random()*opts.length)];
  [tiles[t],tiles[empty]]=[tiles[empty],tiles[t]];
  empty=t;
}

function isSolved(){
  return tiles.every((v,i)=>v===i);
}

function win(){
  let overlay=document.getElementById('overlay');
  let img=document.getElementById('zoomImage');

  img.style.transform="scale(0.8)";
  img.style.opacity="0";

  img.src=imageSrc;

  overlay.style.display="flex";

  requestAnimationFrame(()=>{
    img.style.transform="scale(1)";
    img.style.opacity="1";
  });
}
</script>

</body>
</html>
