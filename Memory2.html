<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Game v2</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
h1 { margin:10px; }

#controls {
  margin:10px auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

#game {
  display:grid;
  gap:6px;
  margin:10px auto;
  touch-action:none;
}

.card {
  position:relative;
  width:100%;
  padding-top:100%;
  border-radius:10px;
  background:#1e293b;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform 0.4s ease;
}
.card.flipped {
  transform:rotateY(180deg);
}

.cardInner {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  transform-style:preserve-3d;
}

.cardFront, .cardBack {
  position:absolute;
  width:100%; height:100%;
  backface-visibility:hidden;
  border-radius:10px;
}

.cardBack {
  background:#334155;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

.cardFront {
  transform:rotateY(180deg);
  background-size:cover;
  background-position:center;
}

#overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#rewardImage {
  max-width:90vw;
  max-height:80vh;
  object-fit:contain;
  transform:scale(0.8);
  opacity:0;
  transition:all 0.5s ease;
}

button {
  padding:8px;
  margin:5px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>🌼 Memory Game</h1>
<p>Moves: <span id="moves">0</span></p>

<div id="controls">

  <label>Pairs (2–10):</label>
  <input type="number" id="pairCount" value="6" min="2" max="10">

  <label>Theme:</label>
  <select id="themeSelect">
    <option value="default">Flowers</option>
    <option value="personalA">Personal A</option>
    <option value="personalB">Personal B</option>
  </select>

  <label>Add Image to Personal Deck:</label>
  <select id="personalTarget">
    <option value="A">Personal A</option>
    <option value="B">Personal B</option>
  </select>

  <input type="file" id="imgUpload">

  <button onclick="startGame()">Start</button>
</div>

<div id="game"></div>

<div id="overlay">
  <h2>✨ You Win! ✨</h2>
  <img id="rewardImage">
  <br>
  <button onclick="startGame()">Play Again</button>
</div>

/* -----------------------------------------------------------
   IndexedDB Setup (Personal Deck A & B)
----------------------------------------------------------- */
let db;
const request = indexedDB.open("MemoryGameDB", 1);

request.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("deckA", { keyPath: "id" });
  db.createObjectStore("deckB", { keyPath: "id" });
};

request.onsuccess = e => { db = e.target.result; };
request.onerror = () => alert("IndexedDB failed to load.");

/* -----------------------------------------------------------
   Load Personal Decks
----------------------------------------------------------- */
async function loadDeck(storeName) {
  return new Promise(resolve => {
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result.map(x => x.src));
  });
}

/* -----------------------------------------------------------
   Save Image to Personal Deck
----------------------------------------------------------- */
document.getElementById('imgUpload').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async () => {
    const target = document.getElementById('personalTarget').value;
    const storeName = target === "A" ? "deckA" : "deckB";

    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);

    const existing = await loadDeck(storeName);
    if (existing.length >= 10) {
      alert("This deck already has 10 images.");
      return;
    }

    store.put({ id: Date.now(), src: reader.result });
    alert("Image added to Personal " + target);
  };
  reader.readAsDataURL(file);
};

/* -----------------------------------------------------------
   Build Deck Based on Theme + Difficulty
----------------------------------------------------------- */
async function buildDeck(pairs) {
  const theme = document.getElementById('themeSelect').value;

  let images = [];

  if (theme === "default") {
    images = defaultDeck.slice(0, pairs);
  } else if (theme === "personalA") {
    const deckA = await loadDeck("deckA");
    if (deckA.length < pairs) {
      alert("Personal A does not have enough images.");
      return null;
    }
    images = deckA.slice(0, pairs);
  } else {
    const deckB = await loadDeck("deckB");
    if (deckB.length < pairs) {
      alert("Personal B does not have enough images.");
      return null;
    }
    images = deckB.slice(0, pairs);
  }

  let deck = [];
  images.forEach((src, idx) => {
    deck.push({ id: idx, src });
    deck.push({ id: idx, src });
  });

  deck.sort(() => Math.random() - 0.5);
  return deck;
}

/* -----------------------------------------------------------
   Game Logic
----------------------------------------------------------- */
let deck = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;

function bestGridForPairs(pairs) {
  const total = pairs * 2;
  let cols = Math.ceil(Math.sqrt(total));
  let rows = Math.ceil(total / cols);
  return { rows, cols };
}

async function startGame() {
  const pairs = +document.getElementById('pairCount').value;
  deck = await buildDeck(pairs);
  if (!deck) return;

  const grid = bestGridForPairs(pairs);
  const game = document.getElementById('game');
  game.innerHTML = "";
  game.style.gridTemplateColumns = `repeat(${grid.cols}, 1fr)`;

  moves = 0;
  document.getElementById('moves').textContent = moves;
  document.getElementById('overlay').style.display = "none";

  deck.forEach(cardData => {
    const card = document.createElement('div');
    card.className = "card";
    card.dataset.id = cardData.id;

    const inner = document.createElement('div');
    inner.className = "cardInner";

    const front = document.createElement('div');
    front.className = "cardFront";
    front.style.backgroundImage = `url(${cardData.src})`;

    const back = document.createElement('div');
    back.className = "cardBack";
    back.textContent = "❓";

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    card.onclick = () => flipCard(card);
    game.appendChild(card);
  });
}

function flipCard(card) {
  if (lockBoard || card.classList.contains("flipped")) return;

  card.classList.add("flipped");

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  lockBoard = true;

  moves++;
  document.getElementById('moves').textContent = moves;

  checkMatch();
}

function checkMatch() {
  const match = firstCard.dataset.id === secondCard.dataset.id;

  if (match) {
    firstCard.onclick = null;
    secondCard.onclick = null;
    resetTurn();
    checkWin();
  } else {
    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");
      resetTurn();
    }, 800);
  }
}

function resetTurn() {
  firstCard = null;
  secondCard = null;
  lockBoard = false;
}

function checkWin() {
  const allFlipped = [...document.querySelectorAll('.card')]
    .every(card => card.classList.contains("flipped"));

  if (allFlipped) showWin();
}

function showWin() {
  const overlay = document.getElementById('overlay');
  const img = document.getElementById('rewardImage');

  img.style.transform = "scale(0.8)";
  img.style.opacity = "0";

  img.src = deck[0].src;

  overlay.style.display = "flex";

  requestAnimationFrame(() => {
    img.style.transform = "scale(1)";
    img.style.opacity = "1";
  });
}
</script>
